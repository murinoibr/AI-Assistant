name: Debug Build & Release Bundle

on:
  push:
    branches: [ main, debug-build-release ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📋 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🧹 Clean build
        run: ./gradlew clean

      - name: 🐛 Debug Build
        run: ./gradlew assembleDebug

      - name: 📦 Build Release AAB (Bundle)
        run: ./gradlew bundleRelease

      - name: 📦 Build Release APK
        run: ./gradlew assembleRelease

      - name: 📁 Create output directory
        run: mkdir -p build-output

      - name: 📋 Copy Debug APK
        run: |
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-output/app-debug.apk \;
          echo "✅ Debug APK copied"

      - name: 📋 Copy Release AAB
        run: |
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} build-output/app-release.aab \;
          echo "✅ Release AAB copied"

      - name: 📋 Copy Release APK
        run: |
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} build-output/app-release.apk \;
          echo "✅ Release APK copied"

      - name: 📊 List generated files
        run: |
          echo "=== Build Artifacts Generated ==="
          ls -lh build-output/
          echo "=================================="

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build-output/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build-output/app-release.aab
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build-output/app-release.apk
          retention-days: 30

      - name: 📦 Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: complete-bundle
          path: build-output/
          retention-days: 30

      - name: 🎉 Build Summary
        if: always()
        run: |
          echo "=== BUILD COMPLETED ==="
          echo "✅ All artifacts are ready for download"
          echo "📦 Bundle location: build-output/"
          echo "🔗 Download from: Actions > Artifacts"
