name: Debug Build & Release Bundle

on:
  push:
    branches: [ main, debug-build-release ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Java 17 (Required for sdkmanager)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 🚀 Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-cleanup: always

      - name: 🧹 Clean build
        run: gradle clean

      - name: 🐛 Debug Build APK
        run: gradle assembleDebug --stacktrace

      - name: 📦 Build Release AAB (Bundle)
        run: gradle bundleRelease --stacktrace

      - name: 📦 Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: 📁 Create output directory
        run: mkdir -p build-output

      - name: 📋 Copy Debug APK
        run: |
          find app/build/outputs/apk -name "*.apk" -type f | head -1 | xargs -I {} cp {} build-output/app-debug.apk
          echo "✅ Debug APK copied"
          ls -lh build-output/app-debug.apk

      - name: 📋 Copy Release AAB
        run: |
          find app/build/outputs/bundle -name "*.aab" -type f | head -1 | xargs -I {} cp {} build-output/app-release.aab
          echo "✅ Release AAB copied"
          ls -lh build-output/app-release.aab

      - name: 📋 Copy Release APK
        run: |
          find app/build/outputs/apk -name "app-release.apk" -type f | head -1 | xargs -I {} cp {} build-output/app-release.apk
          echo "✅ Release APK copied"
          ls -lh build-output/app-release.apk

      - name: 📊 List all generated files
        run: |
          echo "========================================="
          echo "  Build Artifacts Generated Successfully"
          echo "========================================="
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -lh {} \;
          echo ""
          echo "========= Final Output Directory ========"
          ls -lh build-output/
          echo "========================================="

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 🐛-Debug-APK
          path: build-output/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: 📦-Release-AAB-Bundle
          path: build-output/app-release.aab
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 📱-Release-APK
          path: build-output/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 📦 Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ✨-Complete-Bundle
          path: build-output/
          retention-days: 30
          if-no-files-found: warn

      - name: 🎉 Build Summary
        if: success()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║  ✅ BUILD COMPLETED SUCCESSFULLY! ✅  ║"
          echo "╠════════════════════════════════════════╣"
          echo "║  📦 Files Generated:                   ║"
          echo "║  • app-debug.apk                       ║"
          echo "║  • app-release.aab (Bundle)            ║"
          echo "║  • app-release.apk                     ║"
          echo "║                                        ║"
          echo "║  📥 Download from: Actions > Artifacts ║"
          echo "╚════════════════════════════════════════╝"
          echo ""

      - name: ❌ Build Failed
        if: failure()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║  ❌ BUILD FAILED ❌                    ║"
          echo "║  Check the logs above for details      ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          exit 1
